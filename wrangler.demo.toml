# 演示站配置：单站版 Prain 部署到 prainblog.yerinblog.cc.cd
# 与 wrangler.toml（开源模板）分离，这个文件不提交

name = "prainblog-demo"
main = "src/index.ts"
compatibility_date = "2025-05-01"
workers_dev = true

routes = [
  { pattern = "prainblog.yerinblog.cc.cd/*", zone_name = "yerinblog.cc.cd" }
]

assets = { directory = "public", binding = "ASSETS", run_worker_first = false }

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.sql"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "prainblog-demo"
database_id = "90b7885a-6f16-4842-8c6f-f382eebc6c5a"

[[kv_namespaces]]
binding = "KV"
id = "d6f521197b6f40d2988473f8a2bd79b6"

[vars]
DEMO_ADMIN_KEY = "yb-demo-8f3a9c2e5d71"
PRAIN_ENV = "worker"

[observability]
enabled = true
